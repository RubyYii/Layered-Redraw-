    <path id="reflection-ripples" d="M520 614 C640 592 730 630 840 606 M550 675 C700 650 814 695 935 662 M650 737 C790 718 910 755 1075 728" fill="none" stroke="#d7d9c8" stroke-width="8" stroke-linecap="round" opacity="0.36" />
