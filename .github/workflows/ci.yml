name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install raster test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-raster.txt

      - name: Run unit and localhost-security tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python entry points
        run: >-
          python -m py_compile
          skills/redraw-in-layers/scripts/layered_redraw.py
          skills/redraw-in-layers/scripts/design_proofs.py
          skills/redraw-in-layers/scripts/project_features.py
          skills/redraw-in-layers/scripts/raster_project.py
          skills/redraw-in-layers/scripts/reference_intelligence.py

      - name: Check editor JavaScript
        run: node --check skills/redraw-in-layers/assets/editor/app.js

      - name: Verify plugin manifest and license
        run: >-
          python -c "import json, pathlib;
          json.loads(pathlib.Path('.codex-plugin/plugin.json').read_text(encoding='utf-8'));
          assert pathlib.Path('LICENSE').is_file();
          assert pathlib.Path('PROVENANCE.md').is_file()"

      - name: Rebuild and validate the public fixture
        run: |
          python skills/redraw-in-layers/scripts/layered_redraw.py compose examples/cat-cave-npc
          python skills/redraw-in-layers/scripts/layered_redraw.py validate examples/cat-cave-npc
          python skills/redraw-in-layers/scripts/layered_redraw.py quality examples/cat-cave-npc
          python skills/redraw-in-layers/scripts/layered_redraw.py design-check examples/cat-cave-npc

      - name: Require committed generated artifacts to be current
        run: git diff --exit-code -- examples/cat-cave-npc

  scene-builder:
    name: 3D Scene Builder
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/pact-cp03-contracts/package-lock.json
            apps/scene-builder/package-lock.json

      - name: Install CP03 contract dependencies
        working-directory: packages/pact-cp03-contracts
        run: npm ci

      - name: Install 3D application dependencies
        working-directory: apps/scene-builder
        run: npm ci

      - name: Run 3D schema, motion, director, and agent tests
        working-directory: apps/scene-builder
        run: npm test

      - name: Rebuild the deterministic cinematic fixture
        working-directory: apps/scene-builder
        run: npm run build:window-case

      - name: Require committed 3D fixture data to be current
        run: >-
          git diff --exit-code --
          apps/scene-builder/projects/window-case/window-that-wasnt-there.blockout.json
          apps/scene-builder/projects/window-case/shot-manifest.json

      - name: Build the production 3D application
        working-directory: apps/scene-builder
        run: npm run build

      - name: Verify CP03 audience UI and large-project recovery
        working-directory: apps/scene-builder
        shell: bash
        run: |
          npm run dev -- --port 5173 > "$RUNNER_TEMP/scene-builder-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          npm run test:cp03:audience -- --url http://127.0.0.1:5173/
          npm run test:large-autosave -- --url http://127.0.0.1:5173/

  cp03-agent:
    name: CP03 Contracts and Agent Host
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/pact-cp03-contracts/package-lock.json
            apps/scene-builder/package-lock.json
            apps/pact-agent-host/package-lock.json

      - name: Install CP03 contract dependencies
        working-directory: packages/pact-cp03-contracts
        run: npm ci

      - name: Test CP03 contracts
        working-directory: packages/pact-cp03-contracts
        run: npm test

      # The DSH-to-Ruby integration suite imports Scene Builder source directly,
      # so its local contract link must exist in a clean checkout as well.
      - name: Install Scene Builder integration dependencies
        working-directory: apps/scene-builder
        run: npm ci

      - name: Install Agent Host dependencies
        working-directory: apps/pact-agent-host
        run: npm ci

      - name: Test Agent Host
        working-directory: apps/pact-agent-host
        run: npm test

      - name: Type-check Agent Host
        working-directory: apps/pact-agent-host
        run: npm run typecheck

      - name: Build Agent Host
        working-directory: apps/pact-agent-host
        run: npm run build
