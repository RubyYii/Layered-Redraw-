<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Layered Redraw Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Layered Redraw Studio">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span class="brand-copy">
            <strong data-i18n="brandName">叠绘</strong>
            <small data-i18n="brandSubtitle">Layered Redraw Studio</small>
          </span>
        </div>

        <div class="document-identity" aria-live="polite">
          <span class="document-kicker" data-i18n="currentProject">当前工程</span>
          <strong id="documentName" data-i18n="noDocument">尚未打开 SVG</strong>
          <span class="revision-badge" id="revisionBadge">—</span>
        </div>

        <nav class="top-actions" aria-label="文件与工程操作" data-i18n-aria-label="fileActionsLabel">
          <div class="locale-switch" role="group" aria-label="界面语言" data-i18n-aria-label="languageLabel">
            <button class="locale-button" type="button" data-locale="zh" aria-pressed="true">中文</button>
            <button class="locale-button" type="button" data-locale="en" aria-pressed="false">EN</button>
          </div>
          <label class="button button-quiet" for="svgFileInput">
            <span aria-hidden="true">↗</span> <span data-i18n="openSvg">打开 SVG</span>
          </label>
          <input id="svgFileInput" type="file" accept="image/svg+xml,.svg" hidden />
          <button class="button button-quiet" id="loadDemoButton" type="button">
            <span aria-hidden="true">◎</span> <span data-i18n="loadDemo">载入示例</span>
          </button>
          <button class="button button-quiet" id="validateButton" type="button">
            <span aria-hidden="true">✓</span> <span data-i18n="validateStructure">检查结构</span>
          </button>
          <button class="button button-primary" id="topExportButton" type="button" disabled>
            <span data-i18n="exportRequest">导出修改请求</span>
          </button>
        </nav>
      </header>

      <main class="workspace">
        <aside class="panel layer-panel" aria-labelledby="layersTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">SEMANTIC STRUCTURE</p>
              <h1 id="layersTitle" data-i18n="layersTitle">语义图层</h1>
            </div>
            <span class="count-badge" id="layerCount">0</span>
          </div>

          <div class="layer-toolbar">
            <button type="button" id="showAllButton" data-i18n="showAll" disabled>全部显示</button>
            <button type="button" id="clearSelectionButton" data-i18n="clearSelection" disabled>清除选择</button>
          </div>

          <div class="layer-list" id="layerList" role="tree" aria-label="SVG 图层列表" data-i18n-aria-label="layerListLabel">
            <div class="layer-empty">
              <span aria-hidden="true">◇</span>
              <p data-i18n="layerEmptyInitial">打开一个分层 SVG 后，图层会出现在这里。</p>
            </div>
          </div>

          <div class="layer-legend" aria-label="图层状态图例" data-i18n-aria-label="layerLegendLabel">
            <span><i class="dot dot-sage"></i><span data-i18n="selectedLegend">已选择</span></span>
            <span><i class="dot dot-brick"></i><span data-i18n="lockedLegend">已锁定</span></span>
          </div>
        </aside>

        <section class="canvas-panel" aria-labelledby="canvasTitle">
          <div class="canvas-toolbar">
            <div>
              <p class="eyebrow">VECTOR CANVAS</p>
              <h2 id="canvasTitle" data-i18n="canvasTitle">画布</h2>
            </div>
            <div class="mode-switch" role="group" aria-label="选择方式" data-i18n-aria-label="selectionMethodLabel">
              <button class="mode-button is-active" type="button" data-mode="layer">
                <span aria-hidden="true">◫</span> <span data-i18n="modeLayerShort">图层点击</span>
              </button>
              <button class="mode-button" type="button" data-mode="bbox">
                <span aria-hidden="true">⌗</span> <span data-i18n="modeBboxShort">框选</span>
              </button>
              <button class="mode-button" type="button" data-mode="semantic-text">
                <span aria-hidden="true">Aa</span> <span data-i18n="modeTextShort">纯文本</span>
              </button>
            </div>
            <div class="canvas-meta">
              <span id="canvasSize">—</span>
              <span class="separator" aria-hidden="true"></span>
              <span id="selectionSummary" data-i18n="selectionNone">未选择</span>
            </div>
          </div>

          <div class="canvas-stage" id="canvasStage" tabindex="0" aria-label="可交互 SVG 画布" data-i18n-aria-label="canvasStageLabel">
            <div class="paper-grain" aria-hidden="true"></div>
            <div class="canvas-empty" id="canvasEmpty">
              <span class="empty-glyph" aria-hidden="true">◌</span>
              <h3 data-i18n="canvasEmptyTitle">从一张可编辑的 SVG 开始</h3>
              <p data-i18n="canvasEmptyBody">打开本地文件，或载入仓库中的运河示例。</p>
              <label class="button button-primary" for="svgFileInput" data-i18n="chooseSvg">选择 SVG 文件</label>
            </div>
            <div class="artboard" id="artboard" hidden>
              <div class="svg-mount" id="svgMount"></div>
            </div>
            <div class="selection-overlay" id="selectionOverlay" aria-hidden="true"></div>
            <div class="drag-box" id="dragBox" hidden aria-hidden="true"></div>
          </div>

          <div class="canvas-footer">
            <span class="status-dot" id="statusDot"></span>
            <span id="canvasHint" data-i18n="waitingForProject">等待载入工程</span>
            <span class="footer-shortcut" data-i18n="shortcuts">Esc 清除 · Ctrl/⌘ + Enter 生成请求</span>
          </div>
        </section>

        <aside class="panel instruction-panel" aria-labelledby="instructionTitle">
          <div class="panel-heading instruction-heading">
            <div>
              <p class="eyebrow">ART DIRECTION</p>
              <h2 id="instructionTitle" data-i18n="instructionTitle">修改意图</h2>
            </div>
            <span class="step-label">PATCH 01</span>
          </div>

          <section class="context-card" aria-labelledby="contextTitle">
            <div class="section-label-row">
              <h3 id="contextTitle" data-i18n="scopeTitle">作用范围</h3>
              <span id="selectionModeLabel" data-i18n="modeLayer">图层点击</span>
            </div>
            <div class="selection-chips" id="selectionChips">
              <span class="chip chip-muted" data-i18n="noLayerSelected">尚未选择图层</span>
            </div>
            <p class="context-note" id="contextNote" data-i18n="selectScopeHint">点击画布对象或左侧图层来限定修改范围。</p>
          </section>

          <section class="instruction-form">
            <label for="instructionInput" data-i18n="instructionLabel">描述你希望发生的变化</label>
            <textarea
              id="instructionInput"
              rows="7"
              placeholder="例如：让水面更偏灰绿色，减少波纹；保留建筑和暖色窗户不变。"
              data-i18n-placeholder="instructionPlaceholder"
            ></textarea>
            <div class="prompt-examples" aria-label="修改指令示例" data-i18n-aria-label="promptExamplesLabel">
              <button type="button" data-example-key="exampleCalmWaterText" data-i18n="exampleCalmWater">安静水面</button>
              <button type="button" data-example-key="exampleWarmWindowsText" data-i18n="exampleWarmWindows">暖色窗光</button>
              <button type="button" data-example-key="exampleWatercolourText" data-i18n="exampleWatercolour">水彩海报</button>
            </div>
          </section>

          <section class="constraints">
            <label class="check-row">
              <input id="preserveCheckbox" type="checkbox" checked />
              <span class="check-control" aria-hidden="true"></span>
              <span>
                <strong data-i18n="protectUnselected">保护未选图层</strong>
                <small data-i18n="protectUnselectedHint">在补丁中把其余图层列为不可改动。</small>
              </span>
            </label>
          </section>

          <div class="request-actions">
            <button class="button button-primary button-wide" id="buildRequestButton" type="button" disabled>
              <span data-i18n="buildRequest">生成修改请求</span>
            </button>
            <div class="secondary-actions">
              <button class="button button-quiet" id="copyRequestButton" type="button" data-i18n="copyJson" disabled>复制 JSON</button>
              <button class="button button-quiet" id="downloadRequestButton" type="button" data-i18n="downloadFile" disabled>下载文件</button>
            </div>
          </div>

          <details class="request-preview" id="requestPreview">
            <summary data-i18n="viewRequest">查看请求内容</summary>
            <pre id="requestJson" data-i18n="waitingToGenerate">等待生成…</pre>
          </details>

          <section class="validation-card" id="validationCard" hidden aria-live="polite">
            <h3 data-i18n="validationTitle">结构检查</h3>
            <ul id="validationResults"></ul>
          </section>
        </aside>
      </main>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
